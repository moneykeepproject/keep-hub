[package]
name = "keep-hub"
description = "The shared hub of the Keep and Pick apps: one program on the household's computer that phones connect to; it pairs them, knows who may use which app, and passes each request to that app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keep-hub"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
argon2.workspace = true
tiny_http.workspace = true
rustls.workspace = true
rcgen.workspace = true
base64.workspace = true
time.workspace = true
ring.workspace = true
rustls-platform-verifier.workspace = true

# DPAPI, to seal keys before they are written (seal.rs), and a file's owner (owner.rs), as
# ShareKeep. Running as a Windows service (main.rs service-run), as ShareKeep's hub and
# MoneyKeep's capture server (owner decision 2026-11-18).
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }
windows-service = "0.8"
# Windows' firewall and network list (COM) and its adapters, instead of PowerShell (owner
# decision 2026-11-22). MIT OR Apache-2.0, Microsoft's own bindings; windows-sys has no COM.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile.workspace = true
# The small library apps copy, tested here against a real hub (tests/library.rs) so the
# library's own folder needs nothing from this crate.
keep-hub-app = { path = "../keep-hub-app" }
