[package]
name = "keep-hub"
description = "The shared hub of the Keep and Pick apps: one program on the household's computer that phones connect to; it pairs them, knows who may use which app, and passes each request to that app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keep-hub"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
argon2.workspace = true
tiny_http.workspace = true
rustls.workspace = true
rcgen.workspace = true
base64.workspace = true
time.workspace = true

# DPAPI, to seal keys before they are written (seal.rs), as ShareKeep.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
